[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "justprompt"
version = "0.1.0"
description = "A Justfile/Makefile for LLM prompts — define tasks as natural language, run them with any LLM."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "justprompt Contributors"},
]
keywords = ["llm", "task-runner", "makefile", "justfile", "ai", "prompt", "cli", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/justprompt/justprompt"
Repository = "https://github.com/justprompt/justprompt"
Issues = "https://github.com/justprompt/justprompt/issues"

[project.scripts]
justprompt = "justprompt.cli:main"

[tool.setuptools.packages.find]
include = ["justprompt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
